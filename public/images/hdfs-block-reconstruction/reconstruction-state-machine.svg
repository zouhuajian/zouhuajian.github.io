  width="1500"
  height="1020"
  viewBox="0 0 1500 1020"
  role="img"
>
  <defs>
    <marker
      id="arrowhead"
      markerWidth="10"
      markerHeight="8"
      refX="8"
      refY="4"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0,0 L9,4 L0,8 Z" fill="#1e1e1e" />
    </marker>
    <filter
      id="rough"
      filterUnits="userSpaceOnUse"
      x="-20"
      y="-20"
      width="1700"
      height="1250"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012"
        numOctaves="1"
        seed="7"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="0.45"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </defs>
  <rect width="1500" height="1020" fill="#ffffff" />
  <text
