>
  <title id="title">反馈收敛：重新评估，再决定下一步</title>
  <desc id="desc">
    IBR 更新事实并移除对应 pending target；FBR 更新事实但不直接减
    pending；超时移出 pending 条目后重新评估。只有仍需要修复时才进入
    needed。额外副本必须通过安全判断，信息不足时 postponed
    并重扫。各容器不是互斥状态。
  </desc>
