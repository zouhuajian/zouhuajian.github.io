    y="67.2"
    text-anchor="start"
    font-family="Cascadia Code, SFMono-Regular, Consolas, monospace"
    font-size="32"
    font-weight="700"
    fill="#1e1e1e"
  >
    <tspan x="60" dy="0">Reconstruction 队列：由存储事实驱动的状态机</tspan>
  </text>
  <text
