<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Lance 向量索引维护闭环</title>
  <desc id="desc">数据写入改变 fragment 与行身份，正常查询用 fallback 和 mask 保持正确；监控覆盖、segment 和召回后，再选择 delta、merge 或 retrain。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0.04em; }
      .card-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .guard { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="920" rx="28" fill="#f8fafc"/>
  <text x="72" y="68" class="title">Lance 向量索引维护闭环（v10.0.0）</text>
  <text x="72" y="100" class="subtitle">不可变 segment 不随每次写入原地修改；先守住当前版本语义，再根据覆盖、召回和延迟选择维护动作。</text>

  <text x="72" y="150" class="section">DATASET EVENTS</text>
  <g filter="url(#shadow)">
    <rect x="72" y="174" width="300" height="120" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="402" y="174" width="300" height="120" rx="18" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
    <rect x="732" y="174" width="300" height="120" rx="18" fill="#ffffff" stroke="#fda4af" stroke-width="2"/>
    <rect x="1062" y="174" width="300" height="120" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  </g>
  <text x="96" y="211" class="card-title">Append</text>
  <text x="96" y="240" class="body">New fragments are uncovered</text>
  <text x="96" y="265" class="small">Normal query: Flat fallback</text>
  <text x="426" y="211" class="card-title">Update</text>
  <text x="426" y="240" class="body">Delete old rows + append new rows</text>
  <text x="426" y="265" class="small">Mask old; Flat-search new</text>
  <text x="756" y="211" class="card-title">Delete</text>
  <text x="756" y="240" class="body">Immutable entries remain on disk</text>
  <text x="756" y="265" class="small">Deletion mask blocks results</text>
  <text x="1086" y="211" class="card-title">Compaction</text>
  <text x="1086" y="240" class="body">Fragments / row addresses move</text>
  <text x="1086" y="265" class="small">Remap now or defer with FRI</text>

  <path d="M222 294 V350" class="arrow"/>
  <path d="M552 294 V350" class="arrow"/>
  <path d="M882 294 V350" class="arrow"/>
  <path d="M1212 294 V350" class="arrow"/>

  <text x="72" y="344" class="section">CORRECTNESS BOUNDARY</text>
  <g filter="url(#shadow)">
    <rect x="72" y="364" width="1290" height="126" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  </g>
  <text x="104" y="405" class="card-title">Current Dataset search</text>
  <text x="104" y="436" class="body">ANN(indexed fragments) ∪ Flat(unindexed fragments) + deletion / prefilter mask + compaction row-id remap</text>
  <text x="104" y="465" class="small">Correct coverage is preserved in normal mode; fast_search intentionally searches only the indexed subset.</text>

  <path d="M717 490 V548" class="arrow"/>

  <text x="72" y="542" class="section">OBSERVE, THEN ACT</text>
  <g filter="url(#shadow)">
    <rect x="72" y="562" width="390" height="146" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="525" y="562" width="837" height="146" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="100" y="602" class="card-title">Observe</text>
  <text x="100" y="632" class="body">describe_indices() + stats.index_stats()</text>
  <text x="100" y="659" class="small">unindexed rows · segments · bytes</text>
  <text x="100" y="684" class="small">Recall@K · p50 / p95 · cache / RSS</text>

  <path d="M462 635 H510" class="arrow"/>
  <line x1="804" y1="583" x2="804" y2="688" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="1083" y1="583" x2="1083" y2="688" stroke="#cbd5e1" stroke-width="2"/>
  <text x="552" y="602" class="card-title">Append delta</text>
  <text x="552" y="632" class="body">Index uncovered fragments</text>
  <text x="552" y="659" class="small">Keep old segments</text>
  <text x="831" y="602" class="card-title">Merge segments</text>
  <text x="831" y="632" class="body">Reduce ANN fan-out</text>
  <text x="831" y="659" class="small">Publish replacement</text>
  <text x="1110" y="602" class="card-title">Retrain / rebuild</text>
  <text x="1110" y="632" class="body">Only with drift evidence</text>
  <text x="1110" y="659" class="small">Recheck Recall@K</text>

  <path d="M944 708 V754 H267 V722" class="arrow"/>
  <text x="72" y="762" class="section">VERIFY THREE SEPARATE OUTCOMES</text>
  <rect x="72" y="784" width="390" height="82" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="525" y="784" width="390" height="82" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="972" y="784" width="390" height="82" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="98" y="818" class="guard" fill="#166534">Correctness</text>
  <text x="98" y="845" class="small">coverage · filters · deleted rows</text>
  <text x="551" y="818" class="guard" fill="#92400e">Recall</text>
  <text x="551" y="845" class="small">overlap with exact Flat Top-K</text>
  <text x="998" y="818" class="guard" fill="#5b21b6">Speed</text>
  <text x="998" y="845" class="small">p95 · build · bytes · cache</text>
</svg>
