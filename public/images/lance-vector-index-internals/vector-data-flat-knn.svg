<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">Flat KNN exact-search pipeline</title>
  <desc id="desc">A fixed-size vector column and query flow through full scan, distance calculation, invalid-distance filtering, and distance plus row-id ordering to produce exact top-k results.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#059669"/></marker>
    <style>
      .title{font:700 31px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .card-title{font:700 21px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
      .body{font:400 17px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
      .mono{font:400 16px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"PingFang SC",monospace}
      .chip{font:600 16px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect width="1440" height="780" fill="#fff"/>
  <text x="55" y="55" class="title">Flat KNN: exact search is the correctness baseline</text>
  <text x="55" y="92" class="subtitle">同一 Dataset version、filter、metric 与 k 下，对每个有效候选计算真实距离</text>

  <rect x="55" y="135" width="250" height="410" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="82" y="177" class="card-title" fill="#1d4ed8">Vector column</text>
  <text x="82" y="211" class="mono" fill="#1e3a8a">FixedSizeList&lt;f32, 2&gt;</text>
  <text x="82" y="259" class="mono" fill="#334155">
    <tspan x="82" dy="0">r0  [1.0, 0.0]</tspan>
    <tspan x="82" dy="34">r1  [0.8, 0.6]</tspan>
    <tspan x="82" dy="34">r2  [0.0, 1.0]</tspan>
    <tspan x="82" dy="34" fill="#b45309">r3  NULL</tspan>
    <tspan x="82" dy="34" fill="#b45309">r4  [NaN, 0.0]</tspan>
  </text>
  <rect x="82" y="453" width="195" height="58" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="102" y="489" class="mono" fill="#1d4ed8">q = [1.0, 0.0]</text>

  <rect x="360" y="180" width="235" height="320" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="387" y="222" class="card-title" fill="#334155">1 · Full scan</text>
  <text x="387" y="263" class="body" fill="#475569">
    <tspan x="387" dy="0">read vector + _rowid</tspan>
    <tspan x="387" dy="31">preserve row validity</tspan>
  </text>
  <text x="387" y="359" class="mono" fill="#334155">
    <tspan x="387" dy="0">candidate rows</tspan>
    <tspan x="387" dy="28">r0 r1 r2 r3 r4</tspan>
  </text>

  <rect x="650" y="135" width="270" height="410" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="677" y="177" class="card-title" fill="#c2410c">2 · Compute distance</text>
  <text x="677" y="212" class="mono" fill="#9a3412">L2 = Σ(qᵢ - xᵢ)²</text>
  <text x="677" y="268" class="mono" fill="#334155">
    <tspan x="677" dy="0">r0  0.0</tspan>
    <tspan x="677" dy="34">r1  0.4</tspan>
    <tspan x="677" dy="34">r2  2.0</tspan>
    <tspan x="677" dy="34" fill="#b45309">r3  NULL</tspan>
    <tspan x="677" dy="34" fill="#b45309">r4  NaN</tspan>
  </text>
  <rect x="677" y="452" width="216" height="58" rx="10" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text x="701" y="488" class="chip" fill="#9a3412">drop NULL / NaN</text>

  <rect x="975" y="180" width="190" height="320" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1002" y="222" class="card-title" fill="#15803d">3 · Top-K sort</text>
  <text x="1002" y="269" class="mono" fill="#166534">
    <tspan x="1002" dy="0">_distance ASC</tspan>
    <tspan x="1002" dy="30">_rowid ASC</tspan>
  </text>
  <text x="1002" y="359" class="mono" fill="#166534">
    <tspan x="1002" dy="0">r0  0.0</tspan>
    <tspan x="1002" dy="30">r1  0.4</tspan>
    <tspan x="1002" dy="30">r2  2.0</tspan>
  </text>

  <rect x="1220" y="225" width="165" height="230" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1247" y="268" class="card-title" fill="#047857">Exact Top-3</text>
  <text x="1247" y="325" class="mono" fill="#065f46">
    <tspan x="1247" dy="0">1  r0</tspan>
    <tspan x="1247" dy="34">2  r1</tspan>
    <tspan x="1247" dy="34">3  r2</tspan>
  </text>

  <line x1="305" y1="340" x2="350" y2="340" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="595" y1="340" x2="640" y2="340" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="920" y1="340" x2="965" y2="340" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1165" y1="340" x2="1210" y2="340" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="55" y="620" width="1330" height="105" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="82" y="660" class="card-title" fill="#334155">Ground-truth comparison contract</text>
  <text x="82" y="700" class="body" fill="#475569">Dataset version · visible rows · filter · distance metric · query vector · k 必须完全一致</text>
</svg>
