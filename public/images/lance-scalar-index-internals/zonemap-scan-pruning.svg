<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Lance Zone Map scan pruning</title>
  <desc id="desc">A time range predicate skips zones zero and two, returns zone one as an AtMost row range, and rechecks four candidate rows to find two exact matches.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#ea580c"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#059669"/></marker>
    <style>
      .title{font:700 31px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .section{font:700 22px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
      .body{font:400 17px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
      .small{font:400 15px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
      .mono{font:400 15px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"PingFang SC",monospace}
      .mono-bold{font:700 16px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"PingFang SC",monospace}
      .chip{font:600 15px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>
  <text x="55" y="55" class="title">Zone Map search: prove skips, recheck candidates</text>
  <text x="55" y="92" class="subtitle">查询 [00:12, 00:18) · Zone Map 只决定候选范围，最终行仍由原始谓词确认</text>

  <rect x="55" y="135" width="320" height="170" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="82" y="178" class="section" fill="#1d4ed8">1 · Predicate</text>
  <text x="82" y="220" class="mono-bold" fill="#1e3a8a">event_time &gt;= 00:12</text>
  <text x="82" y="252" class="mono-bold" fill="#1e3a8a">event_time &lt;  00:18</text>
  <text x="82" y="282" class="small" fill="#1e40af">half-open range [12,18)</text>

  <line x1="375" y1="220" x2="455" y2="220" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="470" y="120" width="460" height="450" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="497" y="163" class="section" fill="#334155">2 · Compare zone statistics</text>
  <text x="497" y="198" class="small" fill="#475569">keep when zone.max ≥ 12 AND zone.min &lt; 18</text>

  <rect x="497" y="230" width="406" height="82" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="518" y="260" class="mono-bold" fill="#475569">Z0  [01,09]  offsets [0,4)</text>
  <text x="518" y="290" class="chip" fill="#64748b">09 &lt; 12  →  SKIP</text>

  <rect x="497" y="335" width="406" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="518" y="367" class="mono-bold" fill="#c2410c">Z1  [10,19]  offsets [4,8)</text>
  <text x="518" y="401" class="chip" fill="#9a3412">ranges overlap  →  CANDIDATE</text>

  <rect x="497" y="450" width="406" height="82" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="518" y="480" class="mono-bold" fill="#475569">Z2  [21,29]  offsets [8,12)</text>
  <text x="518" y="510" class="chip" fill="#64748b">21 ≥ 18  →  SKIP</text>

  <line x1="930" y1="380" x2="1010" y2="380" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <rect x="1025" y="180" width="360" height="310" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1052" y="225" class="section" fill="#c2410c">3 · AtMost row range</text>
  <text x="1052" y="263" class="mono-bold" fill="#9a3412">F0 offsets [4,8)</text>

  <rect x="1052" y="292" width="306" height="145" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1074" y="324" class="mono" fill="#9a3412">r4  00:10  false positive</text>
  <text x="1074" y="354" class="mono-bold" fill="#047857">r5  00:12  match</text>
  <text x="1074" y="384" class="mono-bold" fill="#047857">r6  00:17  match</text>
  <text x="1074" y="414" class="mono" fill="#9a3412">r7  00:19  false positive</text>
  <text x="1052" y="468" class="small" fill="#9a3412">index result is a superset</text>

  <line x1="1205" y1="490" x2="1205" y2="590" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="1220" y="550" class="small" fill="#047857">read + recheck</text>

  <rect x="865" y="605" width="520" height="175" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="892" y="650" class="section" fill="#047857">4 · Exact dataset result</text>
  <text x="892" y="695" class="mono-bold" fill="#065f46">F0:r5 = 00:12</text>
  <text x="1115" y="695" class="mono-bold" fill="#065f46">F0:r6 = 00:17</text>
  <rect x="892" y="724" width="455" height="34" rx="17" fill="#d1fae5"/>
  <text x="920" y="747" class="chip" fill="#047857">8 / 12 rows pruned before reading column values</text>

  <rect x="55" y="605" width="650" height="175" rx="16" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="82" y="645" class="section" fill="#a16207">Locality controls pruning</text>

  <text x="82" y="680" class="small" fill="#854d0e">Ordered by time</text>
  <text x="82" y="707" class="mono" fill="#713f12">[01,09] [10,19] [21,29]</text>
  <rect x="82" y="724" width="265" height="30" rx="15" fill="#dcfce7"/>
  <text x="105" y="745" class="chip" fill="#166534">1 zone · 8 rows pruned</text>

  <line x1="365" y1="672" x2="365" y2="752" stroke="#fde68a" stroke-width="2"/>

  <text x="390" y="680" class="small" fill="#854d0e">Randomly distributed</text>
  <text x="390" y="707" class="mono" fill="#713f12">[01,29] [04,27] [07,24]</text>
  <rect x="390" y="724" width="275" height="30" rx="15" fill="#fee2e2"/>
  <text x="413" y="745" class="chip" fill="#b91c1c">3 zones · 0 rows pruned</text>

  <text x="55" y="855" class="subtitle">AtMost is an execution contract: the candidate set may be wider than the answer, but must never omit a matching row.</text>
</svg>
