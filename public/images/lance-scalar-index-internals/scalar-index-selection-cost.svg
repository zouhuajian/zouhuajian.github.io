<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Scalar Index end-to-end cost comparison</title>
  <desc id="desc">BTree, Bitmap, and Zone Map pass through index lookup, row-set construction, data reading, and residual recheck with different costs.</desc>
  <defs>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .heading { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; }
      .label { font: 650 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .inverse { fill: #ffffff; }
      .arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="1440" height="820" fill="#ffffff" />
  <text x="60" y="58" class="title">Choose by end-to-end work, not lookup alone</text>
  <text x="60" y="91" class="subtitle">Exactness is a correctness boundary · performance depends on every stage after the index result</text>

  <rect x="60" y="130" width="1320" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="88" y="165" class="label">Example query</text>
  <text x="88" y="194" class="mono">WHERE event_time &gt;= A AND event_time &lt; B</text>
  <text x="860" y="177" class="body">The same predicate can favor a different index</text>
  <text x="860" y="199" class="body">when hit ratio or physical locality changes.</text>

  <g>
    <rect x="60" y="270" width="280" height="118" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="86" y="310" class="heading" fill="#1d4ed8">1 · Index lookup</text>
    <text x="86" y="342" class="body">Find pages, postings,</text>
    <text x="86" y="365" class="body">or candidate zones</text>

    <path d="M 340 329 L 382 329" class="arrow" />

    <rect x="390" y="270" width="280" height="118" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" />
    <text x="416" y="310" class="heading" fill="#6d28d9">2 · Row-set work</text>
    <text x="416" y="342" class="body">Materialize, union,</text>
    <text x="416" y="365" class="body">or keep row ranges</text>

    <path d="M 670 329 L 712 329" class="arrow" />

    <rect x="720" y="270" width="280" height="118" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
    <text x="746" y="310" class="heading" fill="#047857">3 · Data read</text>
    <text x="746" y="342" class="body">Fetch projected columns</text>
    <text x="746" y="365" class="body">for selected rows or zones</text>

    <path d="M 1000 329 L 1042 329" class="arrow" />

    <rect x="1050" y="270" width="330" height="118" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <text x="1076" y="310" class="heading" fill="#c2410c">4 · Residual recheck</text>
    <text x="1076" y="342" class="body">Required for inexact candidates;</text>
    <text x="1076" y="365" class="body">cost grows with false positives</text>
  </g>

  <g>
    <rect x="60" y="438" width="1320" height="82" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <rect x="76" y="454" width="118" height="50" rx="10" fill="#2563eb" />
    <text x="105" y="486" class="heading" fill="#ffffff">BTree</text>
    <text x="225" y="472" class="label">candidate leaf pages</text>
    <text x="225" y="496" class="body">→ exact ids → data reads scale with matching rows and physical scattering → no index residual</text>

    <rect x="60" y="540" width="1320" height="82" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" />
    <rect x="76" y="556" width="118" height="50" rx="10" fill="#7c3aed" />
    <text x="94" y="588" class="heading" fill="#ffffff">Bitmap</text>
    <text x="225" y="574" class="label">M value postings</text>
    <text x="225" y="598" class="body">→ union exact ids → data reads scale with H matching rows → no index residual</text>

    <rect x="60" y="642" width="1320" height="82" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" />
    <rect x="76" y="658" width="118" height="50" rx="10" fill="#059669" />
    <text x="83" y="690" class="heading" fill="#ffffff">Zone Map</text>
    <text x="225" y="676" class="label">small statistics</text>
    <text x="225" y="700" class="body">→ candidate ranges → read selected zones → recheck grows with overlap and false positives</text>
  </g>

  <rect x="60" y="758" width="1320" height="46" rx="12" fill="#0f172a" />
  <text x="720" y="787" text-anchor="middle" class="label inverse">The winner is the plan that removes the most final data work at acceptable maintenance cost.</text>
</svg>
