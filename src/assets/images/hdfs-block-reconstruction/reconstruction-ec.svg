    y="144.0"
    fill="#17243a"
    font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"
    font-size="20"
    font-weight="400"
    text-anchor="middle"
  >
    <tspan x="240.0" dy="0">source DataNodes</tspan>
    <tspan x="240.0" dy="28">不同 internal block indices</tspan>
  </text>
  <path
    d="M 240 191 L 240 246"
    fill="none"
