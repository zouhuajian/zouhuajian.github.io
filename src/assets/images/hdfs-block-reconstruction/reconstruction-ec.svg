<svg
  xmlns="http://www.w3.org/2000/svg"
  width="480"
  height="740"
  viewBox="0 0 480 740"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">03b EC 解码的数据方向</title>
  <desc id="desc">
    sources 的数据由独立读线程并行读取，第一个 target 上的 coordinator
    执行解码，并分别写入目标 storages，targets 再报告给 NameNode。
  </desc>
  <defs>
