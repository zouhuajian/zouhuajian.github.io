    >
      <path
        d="M 0 1 L 9 5 L 0 9"
        fill="none"
        stroke="#334155"
        stroke-width="1.5"
      />
    </marker>
  </defs>
  <rect width="480" height="740" fill="white" />
  <text
    x="24"
    y="44"
    fill="#17243a"
    font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"
    font-size="24"
    font-weight="600"
    text-anchor="start"
  >
    <tspan x="24" dy="0">03b EC 解码的数据方向</tspan>
  </text>
  <text
    x="24"
    y="79"
    fill="#17243a"
    font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"
    font-size="20"
    font-weight="400"
    text-anchor="start"
  >
